intent_sources:
  - slug: infrastructure

  - slug: manual

desired_nodes:
  - name: agbach
    slug: agbach
    node_type: device
    accepted_actual_types:
      - device
    lifecycle: approved

  - name: agdnsmasq
    slug: agdnsmasq
    node_type: service_host
    accepted_actual_types:
      - device
      - virtual_machine
    lifecycle: active

  - name: aghub
    slug: aghub
    node_type: device
    accepted_actual_types:
      - device
    lifecycle: approved

  - name: agfixture
    slug: agfixture
    node_type: service_host
    accepted_actual_types:
      - device
    lifecycle: approved

  - name: agpc
    slug: agpc
    node_type: device
    accepted_actual_types: []
    lifecycle: active

  - name: agstudio
    slug: agstudio
    node_type: device
    accepted_actual_types: []
    lifecycle: active

desired_endpoints:
  - name: primary
    desired_node: agbach
    endpoint_type: primary
    ip_policy: dhcp_reserved
    ip_address: 192.168.0.120
    dns_name: agbach.home.arpa
    mdns_name: agbach.local
    generate_dnsmasq: true
    dnsmasq_record_type: host_record

  - name: primary
    desired_node: agdnsmasq
    endpoint_type: primary
    ip_policy: static
    ip_address: 192.168.0.2
    dns_name: agdnsmasq.home.arpa
    mdns_name: agdnsmasq.local
    generate_dnsmasq: true
    dnsmasq_record_type: host_record
    mac_address: bc:24:11:23:dc:b7

  - name: primary
    desired_node: agfixture
    endpoint_type: primary
    ip_policy: static
    ip_address: 192.168.0.9/24
    gateway_address: 192.168.0.1
    dns_name: agfixture.home.arpa
    mdns_name: agfixture.local
    generate_dnsmasq: false
    dnsmasq_record_type: host_record
    mac_address: bc:24:11:00:01:09

  - name: primary
    desired_node: aghub
    endpoint_type: primary
    ip_policy: dhcp_reserved
    ip_address: 192.168.0.10
    dns_name: aghub.home.arpa
    mdns_name: aghub.local
    generate_dnsmasq: true
    dnsmasq_record_type: host_record

  - name: primary
    desired_node: agpc
    endpoint_type: primary
    ip_policy: dhcp_reserved
    ip_address: 192.168.0.110
    dns_name: agpc.home.arpa
    mdns_name: agpc.local
    generate_dnsmasq: true
    dnsmasq_record_type: host_record

  - name: primary
    desired_node: agstudio
    endpoint_type: primary
    ip_policy: dhcp_reserved
    ip_address: 192.168.0.100
    dns_name: agstudio.home.arpa
    mdns_name: agstudio.local
    generate_dnsmasq: true
    dnsmasq_record_type: host_record

desired_ip_ranges:
  - name: dhcp-reserved
    slug: dhcp-reserved
    start_address: 192.168.0.10
    end_address: 192.168.0.199
    range_policy: dhcp_reservable_pool
    lifecycle: planned
    generate_dnsmasq: true
    dnsmasq_options: {}

  - name: network-infra
    slug: network-infra
    start_address: 192.168.0.2
    end_address: 192.168.0.9
    range_policy: static_pool
    lifecycle: planned
    generate_dnsmasq: false
    dnsmasq_options: {}

  - name: dhcp-unreserved
    slug: dhcp-unreserved
    start_address: 192.168.0.200
    end_address: 192.168.0.250
    range_policy: dhcp_dynamic_pool
    lifecycle: planned
    generate_dnsmasq: true
    dnsmasq_options: {}

desired_compute_platforms:
  - name: aghub-pve
    slug: aghub-pve
    control_node: aghub
    lifecycle: active
    config:
      cluster_name: aghub-proxmox
      default_storage: local-lvm
      default_bridge: vmbr0

desired_compute_instances:
  - desired_node: agdnsmasq
    platform: aghub-pve
    instance_kind: container
    desired_power_state: running
    vcpus: 1
    memory_mb: 512
    root_disk_gb: 8
    config:
      vmid: 108
      template: local:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst
      storage: local-lvm
      bridge: vmbr0
      unprivileged: true

  - desired_node: agfixture
    platform: aghub-pve
    instance_kind: container
    desired_power_state: running
    vcpus: 1
    memory_mb: 512
    root_disk_gb: 8
    config:
      vmid: 109
      template: local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst
      storage: local-lvm
      bridge: vmbr0
      unprivileged: true

desired_services:
  - intent_source: infrastructure
    catalog_namespace: default
    catalog_metadata_name: prometheus
    service_type: service
    name: prometheus
    lifecycle: active

  - intent_source: infrastructure
    catalog_namespace: default
    catalog_metadata_name: grafana
    service_type: service
    name: grafana
    lifecycle: active

  - intent_source: infrastructure
    catalog_namespace: default
    catalog_metadata_name: nomad
    service_type: service
    name: nomad
    lifecycle: active

  - intent_source: infrastructure
    catalog_namespace: default
    catalog_metadata_name: prometheus-node-exporter
    service_type: service
    name: prometheus-node-exporter
    lifecycle: active

  - intent_source: infrastructure
    catalog_namespace: default
    catalog_metadata_name: haos
    service_type: service
    name: haos
    lifecycle: active

  - intent_source: manual
    catalog_namespace: default
    catalog_metadata_name: dnsmasq
    service_type: service
    name: dnsmasq
    lifecycle: active

desired_service_placements:
  - desired_service:
      intent_source: manual
      catalog_namespace: default
      catalog_metadata_name: dnsmasq
      service_type: service
    instance_name: dnsmasq
    desired_node: agdnsmasq
    desired_state: active
    deployment_profile: dnsmasq
    config_schema_version: "1"
    config:
      listen_addresses:
        - 192.168.0.2

desired_node_operational_overrides: []
